<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | My Bike</title><link rel="stylesheet" href="style.css"><script src="products.js"></script><script src="app.js"></script></head><body><main class="wrap"><div id="product"></div></main><div class="sticky-contact"><a class="wa" href="https://wa.me/447459620789">WhatsApp</a><a class="call" href="tel:+447459620789">Call</a><a href="mailto:tomcioszczesniakpriv@gmail.com">Email</a></div><script>initCommon();const id=new URLSearchParams(location.search).get('id');const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.title=p.name+' | My Bike';document.getElementById('product').innerHTML=`<section class="product-top"><div><div class="main-photo"><img id="mainImage" src="${p.images[0]}" alt="${p.name}"></div><div class="thumbs">${p.images.map((x,i)=>`<button class="thumb ${i===0?'active':''}" onclick="document.getElementById('mainImage').src='${x}';document.querySelectorAll('.thumb').forEach(y=>y.classList.remove('active'));this.classList.add('active')"><img src="${x}" alt=""></button>`).join('')}</div></div><div><small>${p.type}</small><h1>${p.name}</h1><div class="price">£${p.price}</div><p>${p.size} · ${p.height} · ${p.wheels}</p><div class="score"><div><b>${t('Overall')}</b><br>${p.overall}/10</div><div><b>${t('Mechanical')}</b><br>${p.mechanical}/10</div><div><b>${t('Cosmetic')}</b><br>${p.cosmetic}/10</div></div><div class="actions"><button class="btn primary" onclick="addToCart('${p.id}')">${t('Add to basket')}</button><a class="btn dark" href="index.html">${t('Home')}</a></div></div></section><section class="content-grid"><article class="panel"><h2>${t('Condition')}</h2><ul>${p.condition.map(x=>`<li>${x}</li>`).join('')}</ul><p>${p.cosmeticText}</p></article><article class="panel"><h2>${t('Specification')}</h2><table class="spec">${p.specs.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></article></section><section class="panel" style="margin-top:18px"><h2>${t('Collection & delivery')}</h2><p>${t('Collection in Swindon or Marlborough. Local delivery within 30 miles.')}</p></section>`;</script></body></html>
